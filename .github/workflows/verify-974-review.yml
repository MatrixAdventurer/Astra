name: Verify journal diff production error identity
on:
  push:
    branches: [verify/974-production-error-identity-20261014]
permissions:
  contents: read
jobs:
  production-error-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: journal-review-followup
          save-cache: 'true'
          install-nextest: 'false'
      - name: Exercise production event shape against prior candidate
        run: |
          git rev-parse HEAD
          rustc --version
          cargo test --locked -p astra-cli --lib review_followup_production_error_without_run_id_is_not_counted_twice -- --nocapture
