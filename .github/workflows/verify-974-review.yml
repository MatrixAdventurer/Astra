name: Verify journal diff review regressions
on:
  push:
    branches: [verify/974-review-followup-20261014-baseline]
permissions:
  contents: read
jobs:
  regression-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: journal-review-followup
          save-cache: 'true'
          install-nextest: 'false'
      - name: Record fixed source and baseline regressions
        shell: bash
        run: |
          git rev-parse HEAD
          rustc --version
          cargo test --locked -p astra-cli --lib review_followup -- --nocapture
