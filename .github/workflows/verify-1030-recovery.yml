name: Verify 1030 recovery
on:
  push:
    branches: [verify/1030-recovery-20261018-personal]
permissions:
  contents: read
jobs:
  sdk-web:
    if: github.repository == 'MatrixAdventurer/Astra'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Install SDK
        run: npm ci --prefix packages/sdk
      - name: Prove four regressions fail on original implementation
        shell: bash
        run: |
          set -euo pipefail
          cp packages/sdk/src/websocket.ts /tmp/fixed-websocket.ts
          trap 'cp /tmp/fixed-websocket.ts packages/sdk/src/websocket.ts' EXIT
          git show HEAD^:packages/sdk/src/websocket.ts > packages/sdk/src/websocket.ts
          set +e
          npm test --prefix packages/sdk -- src/__tests__/websocket-connect-lifecycle.test.ts > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          test "$status" -ne 0
          grep -E '4 failed.*6 passed' /tmp/red.log
      - name: SDK required gate
        env:
          ASTRA_SDK_E2E: '1'
        run: npm run ci --prefix packages/sdk
      - name: Web required gate
        run: |
          npm ci --prefix web
          npm run ci --prefix web
