name: Verify WebSocket callback recovery
on:
  push:
    branches: [verify/1030-callback-recovery]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            web/package-lock.json
      - name: SDK locked install and complete CI
        working-directory: packages/sdk
        env:
          ASTRA_SDK_E2E: '1'
        run: |
          npm ci 2>&1 | tee sdk-install.log
          npm run ci 2>&1 | tee sdk-ci.log
      - name: Web locked install and complete CI
        working-directory: web
        run: |
          npm ci 2>&1 | tee web-install.log
          npm run ci 2>&1 | tee web-ci.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: websocket-recovery-evidence
          path: |
            packages/sdk/sdk-*.log
            web/web-*.log
